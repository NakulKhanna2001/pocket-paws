# Optional: copy to .github/workflows/build.yml to enable GitHub Actions.
# Uploading an active workflow requires GitHub's workflow authorization scope.
name: Build macOS app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check gestures, animal assets, and screen placement
        run: swift run PawsChecks
      - name: Build Apple Silicon and Intel app
        run: UNIVERSAL=1 bash scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Pocket-Paws-macOS
          path: dist/Pocket-Paws-macOS.zip
